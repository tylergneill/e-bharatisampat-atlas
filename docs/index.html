<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-bharatisampat Atlas</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <!-- Sanscript: pick one source you like; this one is commonly used -->
  <script src="https://cdn.jsdelivr.net/npm/@indic-transliteration/sanscript@1.3.3/sanscript.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button id="sidebarToggle" class="sidebar-toggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12h-8" />
          <path d="M21 18h-8" />
          <path d="M3 6v4c0 1.1.9 2 2 2h3" />
          <path d="M3 6v10c0 1.1.9 2 2 2h3" />
        </svg>
      </button>
      <span id="brandTitle" class="brand-title brand-title-link">E-bharatisampat Atlas</span>
      <a href="./about.html" class="topbar-link">About</a>
      <span class="brand-meta">
        <span id="appVersion" class="topbar-link" style="color: var(--muted); margin-left: 25px;"></span>
        <span id="dataUpdated" class="topbar-link selectable-title" style="color: var(--muted); margin-left: 10px;"></span>
      </span>
    </div>

    <nav class="topnav">
      <span class="axisSwitch" role="group" aria-label="Browse by">
        <button id="axis-category" class="axisButton" type="button"
                title="Browse by domain and sub-domain">categories</button>
        <button id="axis-author" class="axisButton" type="button"
                title="Browse by author — including texts filed under several categories">authors</button>
      </span>
      <label class="groupToggle" title="Add the other axis as a secondary grouping">
        <input type="checkbox" id="groupToggle" />
        <span id="groupToggleLabel">group by author</span>
      </label>
      <label class="groupToggle" title="Show only texts that have searchable Unicode text, hiding scan-only entries">
        <input type="checkbox" id="textOnlyToggle" />
        <span>TXT only</span>
      </label>
      <span class="sep">|</span>
      <!-- Search, transliteration and theme wrap as ONE unit: when the nav runs
           out of room these three move to the next line together, rather than
           the theme button being left behind on a line of its own. -->
      <span class="navTools">
        <span class="search-wrap">
          <span class="searchIcon search-wrap-icon" aria-hidden="true"></span>
          <input type="text" id="searchInput" placeholder="Search..." class="search-input" />
          <label class="exactToggle" title="Match the exact title only, instead of anywhere it appears as a substring">
            <input type="checkbox" id="searchExactToggle" />
            exact
          </label>
        </span>
        <span class="sep sep-search">|</span>
        <label class="navlabel" for="schemeSelect">अ→a</label>
        <select id="schemeSelect">
          <option value="devanagari">देवनागरी</option>
          <option value="iast" selected>IAST</option>
          <option value="itrans">ITRANS</option>
          <option value="hk">HK</option>
          <option value="iso">ISO 15919</option>
          <option value="slp1">SLP1</option>
        </select>
        <span class="sep">|</span>
        <button id="themeToggle" class="theme-toggle" type="button" title="Toggle light/dark theme"></button>
      </span>
    </nav>
  </header>

  <div class="layout">
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <aside id="sidenav" class="sidenav">
      <div id="allRow" class="row allRow">
        <span class="title topLevel">All</span>
        <span id="allStats" class="small topLevel allStats"></span>
      </div>
      <hr class="allDivider" />
      <div class="hint">
        <span class="hint-desktop">Option/Shift-click to expand all.</span>
        <span class="hint-touch">Long-press the arrow (or All) to expand all.</span>
      </div>
      <div id="sidebarTree" class="tree"><div class="loadingHint">Loading…</div></div>
    </aside>
    <div id="sidebarResizer" class="sidebar-resizer"></div>

    <main class="mainpane">
      <section id="content" class="content"><div class="loadingHint">Loading…</div></section>
    </main>
  </div>

  <script type="module">
    import { initStaticTranslit } from "./translit-static.js";
    initStaticTranslit("iast");
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
